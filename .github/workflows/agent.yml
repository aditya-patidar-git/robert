name: Deploy Agent

on:
  push:
    branches: [ main, master ]
    paths:
      - 'robert-agent-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Agent code to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AGENT_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.AGENT_SSH_KEY }}
          source: "robert-agent-service/"
          target: "/var/www/agent.universalmct.ai/"

      - name: Deploy to Agent EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AGENT_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.AGENT_SSH_KEY }}
          script: |
            cd /var/www/agent.universalmct.ai/robert-agent-service || exit
           
            # Fetch secrets from AWS Secrets Manager and create sanitized .env with AGENT_ prefix
            aws secretsmanager get-secret-value \
              --secret-id robert-main-secret \
              --region eu-north-1 \
              --query SecretString \
              --output text | \
              jq -r 'to_entries | map("AGENT_\(.key | gsub("[^A-Za-z0-9_]"; "_"))=\(.value)") | .[]' > .env
           
            # Build Docker image
            docker build --no-cache -t robert-agent-service:latest .
           
            # Stop and remove old container if exists
            docker stop robert-agent || true
            docker rm robert-agent || true
           
            # Run new container with sanitized .env
            docker run -d \
              --name robert-agent \
              --restart always \
              -p 3002:3002 \
              --env-file .env \
              robert-agent-service:latest
