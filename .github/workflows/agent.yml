name: Deploy Agent

on:
  push:
    branches: [ main ]
    paths:
      - 'robert-agent-service/**'
      - '.github/workflows/agent.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate unique image tag
        id: tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Copy Agent code to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AGENT_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.AGENT_SSH_KEY }}
          source: "robert-agent-service/"
          target: "/var/www/robert-main/"

      - name: Deploy to Agent EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AGENT_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.AGENT_SSH_KEY }}
          script: |
            set -e

            IMAGE_TAG="${{ steps.tag.outputs.IMAGE_TAG }}"
            cd /var/www/robert-main/robert-agent-service || exit

            echo "Removing old .env..."
            rm -f .env

            echo "Creating .env file..."
            echo "PORT=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_PORT)" >> .env
            echo "NODE_ENV=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_NODE_ENV)" >> .env
            echo "FORCE_HTTPS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_FORCE_HTTPS)" >> .env
            echo "BASE_URL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_BASE_URL)" >> .env
            echo "BACKEND_URL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_BACKEND_URL)" >> .env
            echo "MONGO_URI=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_MONGO_URI)" >> .env
            echo "TWILIO_SID=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TWILIO_SID)" >> .env
            echo "TWILIO_AUTH_TOKEN=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TWILIO_AUTH_TOKEN)" >> .env
            echo "TWILIO_NUMBER=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TWILIO_NUMBER)" >> .env
            echo "VERIFIED_CALLER_ID=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_VERIFIED_CALLER_ID)" >> .env
            echo "TWILIO_SYNC_SERVICE_SID=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TWILIO_SYNC_SERVICE_SID)" >> .env
            echo "SYNC_SESSION_TTL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SYNC_SESSION_TTL)" >> .env
            echo "TWILIO_SIP_TRUNK_SID=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TWILIO_SIP_TRUNK_SID)" >> .env
            echo "TWILIO_SIP_DOMAIN=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TWILIO_SIP_DOMAIN)" >> .env
            echo "OPENAI_API_KEY=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_OPENAI_API_KEY)" >> .env
            echo "OPENAI_VECTOR_STORE_ID=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_OPENAI_VECTOR_STORE_ID)" >> .env
            echo "OPENAI_VECTOR_STORE_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_OPENAI_VECTOR_STORE_NAME)" >> .env
            echo "OPENAI_SIP_ENDPOINT=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_OPENAI_SIP_ENDPOINT)" >> .env
            echo "BRAVE_SEARCH_API_KEY=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_BRAVE_SEARCH_API_KEY)" >> .env
            echo "ABUSE_MAX_CALLS_PER_WINDOW=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_ABUSE_MAX_CALLS_PER_WINDOW)" >> .env
            echo "ABUSE_RATE_LIMIT_WINDOW_MS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_ABUSE_RATE_LIMIT_WINDOW_MS)" >> .env
            echo "ABUSE_SUSPICIOUS_PATTERN_THRESHOLD=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_ABUSE_SUSPICIOUS_PATTERN_THRESHOLD)" >> .env
            echo "ABUSE_BLOCK_DURATION_MS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_ABUSE_BLOCK_DURATION_MS)" >> .env
            echo "SESSION_TTL_MINUTES=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SESSION_TTL_MINUTES)" >> .env
            echo "MAX_SESSIONS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_MAX_SESSIONS)" >> .env
            echo "SESSION_CLEANUP_INTERVAL_SECONDS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SESSION_CLEANUP_INTERVAL_SECONDS)" >> .env
            echo "EXECUTION_LOCK_TIMEOUT_MINUTES=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_EXECUTION_LOCK_TIMEOUT_MINUTES)" >> .env
            echo "EXECUTION_HEARTBEAT_INTERVAL_SECONDS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_EXECUTION_HEARTBEAT_INTERVAL_SECONDS)" >> .env
            echo "SESSION_RECOVERY_ENABLED=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SESSION_RECOVERY_ENABLED)" >> .env
            echo "SESSION_PERSIST_INTERVAL_SECONDS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SESSION_PERSIST_INTERVAL_SECONDS)" >> .env
            echo "SMTP_HOST=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SMTP_HOST)" >> .env
            echo "SMTP_PORT=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SMTP_PORT)" >> .env
            echo "SMTP_SECURE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SMTP_SECURE)" >> .env
            echo "SMTP_USER=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SMTP_USER)" >> .env
            echo "SMTP_PASSWORD=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SMTP_PASSWORD)" >> .env
            echo "SMTP_FROM=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SMTP_FROM)" >> .env
            echo "GMAIL_OAUTH_CLIENT_ID=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_GMAIL_OAUTH_CLIENT_ID)" >> .env
            echo "GMAIL_OAUTH_CLIENT_SECRET=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_GMAIL_OAUTH_CLIENT_SECRET)" >> .env
            echo "GMAIL_OAUTH_TOKEN_PATH=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_GMAIL_OAUTH_TOKEN_PATH)" >> .env
            echo "GMAIL_TOKEN_ENCRYPTION_KEY=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_GMAIL_TOKEN_ENCRYPTION_KEY)" >> .env
            echo "BROWSER_MAX_USE_COUNT=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_BROWSER_MAX_USE_COUNT)" >> .env
            echo "BROWSER_POOL_SIZE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_BROWSER_POOL_SIZE)" >> .env
            echo "CRM_LOGIN_URL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CRM_LOGIN_URL)" >> .env
            echo "CRM_HOME_URL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CRM_HOME_URL)" >> .env
            echo "CRM_LOGIN_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CRM_LOGIN_NAME)" >> .env
            echo "CRM_USERNAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CRM_USERNAME)" >> .env
            echo "CRM_PASSWORD=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CRM_PASSWORD)" >> .env
            echo "CRM_ANTIFORGERY_COOKIE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CRM_ANTIFORGERY_COOKIE)" >> .env
            echo "CRM_SESSION_COOKIE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CRM_SESSION_COOKIE)" >> .env
            echo "KEEP_BROWSER_OPEN=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_KEEP_BROWSER_OPEN)" >> .env
            echo "SIP_ENABLED=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_SIP_ENABLED)" >> .env
            echo "AUDIO_DIAGNOSTICS_ENABLED=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_AUDIO_DIAGNOSTICS_ENABLED)" >> .env
            echo "DISABLE_TOOL_FILTERING=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_DISABLE_TOOL_FILTERING)" >> .env
            echo "TRANSCRIPT_PERSIST_IGNORE_CONSENT=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TRANSCRIPT_PERSIST_IGNORE_CONSENT)" >> .env
            echo "CALL_TO=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CALL_TO)" >> .env
            echo "CLIENT_EMAIL_ADDRESS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CLIENT_EMAIL_ADDRESS)" >> .env
            echo "CLIENT_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CLIENT_NAME)" >> .env
            echo "CARD_NUMBER=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CARD_NUMBER)" >> .env
            echo "CARD_EXPIRY_DATE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CARD_EXPIRY_DATE)" >> .env
            echo "CARD_SECURITY_CODE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CARD_SECURITY_CODE)" >> .env
            echo "CARD_HOLDERS_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_CARD_HOLDERS_NAME)" >> .env
            echo "TEST_CLIENT_MOBILE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_CLIENT_MOBILE)" >> .env
            echo "TEST_CLIENT_EMAIL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_CLIENT_EMAIL)" >> .env
            echo "TEST_CLIENT_FULL_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_CLIENT_FULL_NAME)" >> .env
            echo "TEST_CLIENT_POSTCODE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_CLIENT_POSTCODE)" >> .env
            echo "TEST_CLIENT_TELEPHONE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_CLIENT_TELEPHONE)" >> .env
            echo "TEST_TWILIO_NUMBER=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_TWILIO_NUMBER)" >> .env
            echo "TEST_PREFERRED_DATE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_PREFERRED_DATE)" >> .env
            echo "TEST_PREFERRED_TIME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_PREFERRED_TIME)" >> .env
            echo "TEST_LOCATION=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_LOCATION)" >> .env
            echo "TEST_BIKE_TYPE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_BIKE_TYPE)" >> .env
            echo "TEST_TERMS_ACCEPTED=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_TEST_TERMS_ACCEPTED)" >> .env
            echo "RUN_MONGO_UNIT_TESTS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_RUN_MONGO_UNIT_TESTS)" >> .env
            echo "RUN_INTEGRATION_TESTS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_RUN_INTEGRATION_TESTS)" >> .env
            echo "AGENT_SERVICE_API_KEY=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .AGENT_AGENT_SERVICE_API_KEY)" >> .env

            echo "Building Docker image with tag: $IMAGE_TAG..."
            docker build --no-cache -t agent.universalmct.ai:$IMAGE_TAG .

            echo "Stopping old container (if exists)..."
            docker stop agent.universalmct.ai || true
            docker rm agent.universalmct.ai || true

            echo "Starting new container..."
            docker run -d \
              --name agent.universalmct.ai \
              --restart always \
              -p 3002:3002 \
              --env-file .env \
              -v agent-data:/app/data \
              agent.universalmct.ai:$IMAGE_TAG

            echo "Cleaning old Docker images (keep latest 2)..."
            docker images agent.universalmct.ai --format "{{.ID}}" | tail -n +3 | xargs -r docker rmi -f

            echo "Removing dangling images..."
            docker image prune -f

            echo "Deployment completed successfully "        
