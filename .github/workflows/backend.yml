name: Deploy Backend

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Backend code to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          source: "backend/"
          target: "/var/www/robert-main-old/"

      - name: Deploy to Backend EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          script: |
            cd /var/www/robert-main-old/backend || exit

            # Fetch secrets from AWS Secrets Manager and create sanitized .env with BACKEND_ prefix
            aws secretsmanager get-secret-value \
              --secret-id robert-main-secret \
              --region eu-north-1 \
              --query SecretString \
              --output text | \
              jq -r 'to_entries | map("BACKEND_\(.key | gsub("[^A-Za-z0-9_]"; "_"))=\(.value)") | .[]' > .env

            # Build Docker image
            docker build -t api.universalmct.ai:latest .

            # Stop and remove old container if exists
            docker stop backend-container || true
            docker rm backend-container || true

            # Run new container with .env
            docker run -d \
              --name backend-container \
              --restart always \
              -p 5000:5000 \
              --env-file .env \
              api.universalmct.ai:latest
