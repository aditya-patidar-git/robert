name: Deploy Backend
 
on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Copy Backend code to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          source: "backend/"
          target: "/var/www/api.universalmct.ai/"
 
      - name: Deploy to Backend EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          script: |
            cd /var/www/api.universalmct.ai/backend || exit
           
            # Fetch secrets from AWS Secrets Manager and create .env file
            aws secretsmanager get-secret-value --secret-id robert-backend-secrets --region us-east-1 --query SecretString --output text | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > .env
           
            docker build -t api.universalmct.ai:latest .
            docker stop api.universalmct.ai || true
            docker rm api.universalmct.ai || true
            docker run -d \
              --name api.universalmct.ai \
              --restart always \
              -p 5000:5000 \
              --env-file .env \
              api.universalmct.ai:latest
 
