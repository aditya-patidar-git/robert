name: Deploy Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate unique image tag
        id: tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Copy Backend code to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          source: "backend/"
          target: "/var/www/api.universalmct.ai/"

      - name: Deploy to Backend EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          script: |
            set -e

            IMAGE_TAG="${{ steps.tag.outputs.IMAGE_TAG }}"
            cd /var/www/api.universalmct.ai/backend || exit

            echo "Removing old .env..."
            rm -f .env

            echo "Creating .env file..."
            echo "TWILIO_SID=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TWILIO_SID)" >> .env
            echo "TWILIO_AUTH_TOKEN=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TWILIO_AUTH_TOKEN)" >> .env
            echo "TWILIO_NUMBER=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TWILIO_NUMBER)" >> .env
            echo "MONGO_URI=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_MONGO_URI)" >> .env
            echo "OPENAI_API_KEY=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_OPENAI_API_KEY)" >> .env
            echo "OPENAI_VECTOR_STORE_ID=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_OPENAI_VECTOR_STORE_ID)" >> .env
            echo "OPENAI_VECTOR_STORE_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_OPENAI_VECTOR_STORE_NAME)" >> .env
            echo "NODE_ENV=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_NODE_ENV)" >> .env
            echo "FORCE_HTTPS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_FORCE_HTTPS)" >> .env
            echo "JWT_SECRET=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_JWT_SECRET)" >> .env
            echo "FRONTEND_URL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_FRONTEND_URL)" >> .env
            echo "BASE_URL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_BASE_URL)" >> .env
            echo "AGENT_SERVICE_URL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_AGENT_SERVICE_URL)" >> .env
            echo "AGENT_SERVICE_API_KEY=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_AGENT_SERVICE_API_KEY)" >> .env
            echo "GMAIL_OAUTH_CLIENT_ID=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_GMAIL_OAUTH_CLIENT_ID)" >> .env
            echo "GMAIL_OAUTH_CLIENT_SECRET=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_GMAIL_OAUTH_CLIENT_SECRET)" >> .env
            echo "GMAIL_OAUTH_TOKEN_PATH=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_GMAIL_OAUTH_TOKEN_PATH)" >> .env
            echo "GMAIL_TOKEN_ENCRYPTION_KEY=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_GMAIL_TOKEN_ENCRYPTION_KEY)" >> .env
            echo "CLIENT_EMAIL_ADDRESS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CLIENT_EMAIL_ADDRESS)" >> .env
            echo "CLIENT_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CLIENT_NAME)" >> .env
            echo "CARD_NUMBER=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CARD_NUMBER)" >> .env
            echo "CARD_EXPIRY_DATE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CARD_EXPIRY_DATE)" >> .env
            echo "CARD_SECURITY_CODE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CARD_SECURITY_CODE)" >> .env
            echo "CARD_HOLDERS_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CARD_HOLDERS_NAME)" >> .env
            echo "TEST_BIKE_TYPE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_BIKE_TYPE)" >> .env
            echo "TEST_TERMS_ACCEPTED=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_TERMS_ACCEPTED)" >> .env
            echo "TEST_CLIENT_MOBILE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_CLIENT_MOBILE)" >> .env
            echo "TEST_CLIENT_EMAIL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_CLIENT_EMAIL)" >> .env
            echo "TEST_CLIENT_FULL_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_CLIENT_FULL_NAME)" >> .env
            echo "TEST_CLIENT_POSTCODE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_CLIENT_POSTCODE)" >> .env
            echo "TEST_CLIENT_TELEPHONE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_CLIENT_TELEPHONE)" >> .env
            echo "TEST_PREFERRED_DATE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_PREFERRED_DATE)" >> .env
            echo "TEST_PREFERRED_TIME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_PREFERRED_TIME)" >> .env
            echo "TEST_LOCATION=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_TEST_LOCATION)" >> .env
            echo "SESSION_TTL_MINUTES=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SESSION_TTL_MINUTES)" >> .env
            echo "MAX_SESSIONS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_MAX_SESSIONS)" >> .env
            echo "SESSION_CLEANUP_INTERVAL_SECONDS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SESSION_CLEANUP_INTERVAL_SECONDS)" >> .env
            echo "EXECUTION_LOCK_TIMEOUT_MINUTES=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_EXECUTION_LOCK_TIMEOUT_MINUTES)" >> .env
            echo "EXECUTION_HEARTBEAT_INTERVAL_SECONDS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_EXECUTION_HEARTBEAT_INTERVAL_SECONDS)" >> .env
            echo "SESSION_RECOVERY_ENABLED=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SESSION_RECOVERY_ENABLED)" >> .env
            echo "SESSION_PERSIST_INTERVAL_SECONDS=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SESSION_PERSIST_INTERVAL_SECONDS)" >> .env
            echo "SMTP_HOST=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SMTP_HOST)" >> .env
            echo "SMTP_PORT=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SMTP_PORT)" >> .env
            echo "SMTP_SECURE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SMTP_SECURE)" >> .env
            echo "SMTP_USER=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SMTP_USER)" >> .env
            echo "SMTP_PASSWORD=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SMTP_PASSWORD)" >> .env
            echo "SMTP_FROM=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SMTP_FROM)" >> .env
            echo "CRM_LOGIN_NAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CRM_LOGIN_NAME)" >> .env
            echo "CRM_USERNAME=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CRM_USERNAME)" >> .env
            echo "CRM_LOGIN_URL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CRM_LOGIN_URL)" >> .env
            echo "CRM_HOME_URL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CRM_HOME_URL)" >> .env
            echo "CRM_ANTIFORGERY_COOKIE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CRM_ANTIFORGERY_COOKIE)" >> .env
            echo "CRM_SESSION_COOKIE=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_CRM_SESSION_COOKIE)" >> .env
            echo "PAYMENT_EMAIL=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_PAYMENT_EMAIL)" >> .env
            echo "SIP_ENABLED=$(aws secretsmanager get-secret-value --secret-id robert-main-secret --region eu-north-1 --query SecretString --output text | jq -r .BACKEND_SIP_ENABLED)" >> .env

            echo "Building Docker image with tag: $IMAGE_TAG..."
            docker build --no-cache -t api.universalmct.ai:$IMAGE_TAG .

            echo "Stopping old container (if exists)..."
            docker stop backend-container || true
            docker rm backend-container || true

            echo "Starting new container..."
            docker run -d \
                --name backend-container \
                --restart always \
                -p 5000:5000 \
                --env-file .env \
                -v backend-data:/app/data \
                api.universalmct.ai:$IMAGE_TAG

            echo "Cleaning old Docker images (keep latest 2)..."
            docker images api.universalmct.ai --format "{{.ID}}" | tail -n +3 | xargs -r docker rmi -f

            echo "Removing dangling images..."
            docker image prune -f

            echo "Deployment completed successfully "
