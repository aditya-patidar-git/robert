name: Deploy Frontend
 
on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Copy Frontend code to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          source: "frontend/"
          target: "/var/www/fe.universalmct.ai/"
 
      - name: Deploy to Frontend EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            cd /var/www/fe.universalmct.ai/frontend || exit
           
            # Fetch secrets from AWS Secrets Manager and create .env file
            aws secretsmanager get-secret-value --secret-id robert-frontend-secrets --region us-east-1 --query SecretString --output text | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > .env
           
            docker build --no-cache -t fe.universalmct.ai:latest .
            docker stop fe.universalmct.ai || true
            docker rm fe.universalmct.ai || true
            docker run -d \
              --name fe.universalmct.ai \
              --restart always \
              -p 80:80 \
              --env-file .env \
              fe.universalmct.ai:latest
 
 
