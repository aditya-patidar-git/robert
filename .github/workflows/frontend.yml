name: Deploy Frontend
 
on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Copy Frontend code to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          source: "frontend/"
          target: "/var/www/robert-main-old/"
 
      - name: Deploy to Frontend EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            set -e
 
            cd /var/www/robert-main-old/frontend || exit
 
            echo "Removing old .env..."
            rm -f .env
 
            echo "Fetching secrets from AWS..."
            SECRET=$(aws secretsmanager get-secret-value \
              --secret-id robert-main-secret \
              --region eu-north-1 \
              --query SecretString \
              --output text)
 
            echo "Creating .env file..."
            echo "FRONTEND_VITE_API_BASE=$(echo $SECRET | jq -r .VITE_API_BASE)" >> .env
            echo "FRONTEND_VITE_BACKEND_URL=$(echo $SECRET | jq -r .VITE_BACKEND_URL)" >> .env
            echo "FRONTEND_REACT_APP_BACKEND_URL=$(echo $SECRET | jq -r .REACT_APP_BACKEND_URL)" >> .env
 
            echo "Building Docker image..."
            docker build --no-cache -t fe.universalmct.ai:latest .
 
            echo "Stopping old container (if exists)..."
            docker stop fe.universalmct.ai || true
            docker rm fe.universalmct.ai || true
 
            echo "Starting new container..."
            docker run -d \
              --name fe.universalmct.ai \
              --restart always \
              -p 3000:80 \
              --env-file .env \
              fe.universalmct.ai:latest
 
            echo "Cleaning old Docker images (keep latest 2)..."
            docker images fe.universalmct.ai --format "{{.ID}}" | tail -n +3 | xargs -r docker rmi -f
 
            echo "Removing dangling images..."
            docker image prune -f
 
            echo "Deployment completed successfully 🚀"
 
